# Render Blueprint: New > Blueprint > pick this repository.
# Free instances sleep when idle and their disk is reset on every deploy, so history starts empty after a redeploy.
services:
  - type: web
    name: fake-news-detector
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FNDS_SECRET_KEY
        generateValue: true
      - key: FNDS_ADMIN_PASSWORD
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4
      - key: FACTCHECK_API_KEY
        sync: false
